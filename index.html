<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>重大犯罪・トクリュウ事件マップ 2026</title>
<style>
:root{--bg:#f7f7f5;--surface:#fff;--ink:#111418;--ink2:#3d434b;--line:#c9ced6;--accent:#0b4f9c;--accent-ink:#fff;--focus:#c2410c;--err:#a3261b}
@media (prefers-color-scheme:dark){:root{--bg:#111317;--surface:#1b1e24;--ink:#f1f3f6;--ink2:#c4cad3;--line:#4a515c;--accent:#7db7ff;--accent-ink:#0b1220;--focus:#ffb070;--err:#ff8a7d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;font-size:17px;line-height:1.8;padding:1rem}
main{width:min(460px,100%);background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:1.6rem 1.4rem}
h1{font-size:1.3rem;line-height:1.5;margin:0 0 .3rem}
.logo{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:1.2rem;margin-bottom:.5rem}
p{margin:.3rem 0;color:var(--ink2)}
label{display:block;font-weight:700;margin:1rem 0 .3rem}
.row{display:flex;gap:.4rem}
input[type=password],input[type=text]{flex:1;min-height:48px;font-size:1.1rem;padding:.3rem .7rem;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);letter-spacing:.05em}
button{min-height:48px;border-radius:10px;font:inherit;cursor:pointer}
.eye{min-width:64px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:.85rem}
.go{width:100%;margin-top:1rem;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem}
.go[disabled]{opacity:.6;cursor:wait}
.chk{display:flex;align-items:center;gap:.5rem;margin-top:.8rem;min-height:44px;cursor:pointer}
.chk input{width:1.3rem;height:1.3rem;accent-color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#msg{min-height:1.6em;margin-top:.6rem;font-weight:700;color:var(--err)}
#msg.ok{color:var(--ink2)}
.small{font-size:.86rem;margin-top:1rem;border-top:1px solid var(--line);padding-top:.8rem}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🛡️</div>
  <h1>重大犯罪・トクリュウ事件マップ 2026</h1>
  <p>購入者限定のページです。noteの記事（有料部分）に書かれたパスワードを入力してください。</p>
  <form id="f" autocomplete="off" novalidate>
    <label for="pw">パスワード</label>
    <div class="row">
      <input id="pw" type="password" inputmode="text" autocapitalize="off" spellcheck="false" aria-describedby="msg hint" required>
      <button class="eye" id="eye" type="button" aria-pressed="false" aria-controls="pw">表示</button>
    </div>
    <p id="hint" style="font-size:.86rem">大文字と小文字を区別します。</p>
    <label class="chk"><input type="checkbox" id="rem" checked> この端末で記憶する（次回から入力不要）</label>
    <button class="go" id="go" type="submit">開く</button>
    <p id="msg" role="alert" aria-live="assertive"></p>
  </form>
  <p class="small">転載・再配布・パスワードの共有は禁止です。パスワードは定期的に変更します。変更後は、noteの記事で新しいパスワードをご確認ください。<br>運営：古谷浩二（DWA防災情報センター）　お問い合わせ：dwa8791@bousai0111.info</p>
</main>

function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function b64(a){var s="";a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
var $=function(id){return document.getElementById(id)};
function msg(t,ok){$("msg").textContent=t;$("msg").className=ok?"ok":""}
async function derive(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(D.s),iterations:D.n,hash:"SHA-256"},base,256));
}
async function open(raw){
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
function store(raw){try{localStorage.setItem(K,JSON.stringify({v:D.v,k:b64(raw)}))}catch(e){}}

(async function(){

  $("pw").focus();

$("f").addEventListener("submit",async function(e){
  e.preventDefault();var pw=$("pw").value.trim();
  if(!pw){msg("パスワードを入力してください。");$("pw").focus();return}
  $("go").disabled=true;msg("確認しています…",true);
